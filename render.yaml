services:
  # ----------------------------------------------------------------------------
  # Backend Web Service (FastAPI + Uvicorn + ML Engine)
  # ----------------------------------------------------------------------------
  - type: web
    name: smartmastitis-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./smartmastitis.db
      - key: ENVIRONMENT
        value: production

  # ----------------------------------------------------------------------------
  # Frontend Static Site (React 19 + TypeScript + Vite)
  # ----------------------------------------------------------------------------
  - type: web
    name: smartmastitis-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
